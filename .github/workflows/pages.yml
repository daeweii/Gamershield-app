# Builds GamerShield and publishes it to GitHub Pages.
#
# - Pull requests: run the typecheck, tests, and build (nothing is published).
# - Pushes to main: same checks, then publish. If any check fails, the live
#   site stays as it was.
#
# Security notes:
# - Every action is pinned to a full commit SHA, not a tag. Tags can be moved
#   to point at different code; a SHA can't. The comment shows the version.
# - Permissions are read-only by default. Only the deploy job can write to Pages.
# - Dependencies install from the lockfile exactly (--frozen-lockfile).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push cancels an older in-progress build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the run (and blocks deploying) if any shipped dependency has a
      # known vulnerability. Build-only tools are reported but don't block,
      # since new advisories can appear on any day without a code change.
      - name: Audit shipped dependencies
        run: pnpm audit --prod

      - name: Audit build tools (report only)
        run: pnpm audit
        continue-on-error: true

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm --filter @workspace/gamershield run test

      - name: Build
        run: pnpm --filter @workspace/gamershield run build
        env:
          NODE_ENV: production
          # The site lives at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # vite.config.ts requires PORT even though building doesn't use it.
          PORT: '3000'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: artifacts/gamershield/dist/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
